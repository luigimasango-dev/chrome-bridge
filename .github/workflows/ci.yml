name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Smoke test (tools/list over stdio, no Chrome needed)
        run: node test/smoke.mjs
      - name: WS routing regression (fake extension, no Chrome needed)
        run: node test/ws_routing.mjs
