<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 260px; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; }
    .badge { font-weight: 600; }
    .ok { color: #0f9d58; }
    .err { color: #d93025; }
    code { background: #f1f3f4; padding: 1px 4px; border-radius: 3px; }
    .note { font-size: 11px; color: #5f6368; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Chrome Bridge</h1>
  <div class="row"><span>Status:</span><span id="status" class="badge err">connecting…</span></div>
  <div class="row"><span>Server:</span><span><code>ws://127.0.0.1:8765</code></span></div>
  <div class="row"><span>Active tab:</span><span id="tab">—</span></div>
  <div class="note">Opens a WebSocket to the local Chrome Bridge MCP server. Keep Chrome open while agents need the browser.</div>
  <script src="popup.js"></script>
</body>
</html>
